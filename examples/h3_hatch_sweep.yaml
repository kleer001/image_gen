# Chasing the weave in lit skin. One prompt, one seed, one variable at a time.
#
# Three lines of attack, all of them from what practitioners actually report
# rather than from a theory about the cause:
#   - more steps, since the distill is only trained for 4-8 and over-sharpening
#     past its range is a known failure
#   - sampler and scheduler, because res_multistep + simple comes from the
#     official template and appears in nobody's recommended list
#   - scaling the latent before the VAE decode, the "make it less contrasty"
#     trick, which is reported to recover skin detail
#
# beta57 and bong_tangent are not in a stock ComfyUI build; they come with the
# RES4LYF node pack and are not tested here.
#
#   scripts/h3_batch.py examples/h3_hatch_sweep.yaml
title: MiniMax H3 — chasing the weave in lit skin
seconds: 5
seed: 7
width: 864
height: 480
steps: 8
sampler: res_multistep
scheduler: simple
base_loras:
  - [h3_turbo_larryvrh_v4_step600_ema.safetensors, 1.0]

prompt: |-
  integrated_multimodal_description: [Shot 1] Live-action, cinematic, a tight
  close-up frames the face of a weathered woman in her fifties inside the cockpit
  of a working cargo hauler. Practical instrument light from below picks out
  visible pores, fine lines at the eye, a healed scar through one eyebrow and the
  dry texture of skin after a long shift. Her breath fogs faintly in the cold.
  Behind her the canopy shows a slow-turning gas giant, its banded cloud tops
  throwing pale reflected light across the left side of her face while the right
  falls into deep shadow. She blinks, glances off to a readout, then back toward
  the camera. The camera pushes in with small amplitude at slow speed.

  overall_soundscape: The steady low thrum of a cargo hauler under way, air
  circulating through a vent close by, the soft click of instrument switches, her
  slow breathing.

  non_diegetic_music: None.

variants:
  - label: baseline 8 steps
  - label: 12 steps
    steps: 12
  - label: 20 steps
    steps: 20
  - label: 20 steps, no distill
    steps: 20
    loras: []

  - label: euler + beta
    sampler: euler
    scheduler: beta
  - label: euler + simple
    sampler: euler
    scheduler: simple
  - label: er_sde + beta
    sampler: er_sde
    scheduler: beta
  - label: sa_solver + beta
    sampler: sa_solver
    scheduler: beta

  - label: latent x0.9 (less contrast)
    latent_scale: 0.9
  - label: latent x0.8 (less contrast)
    latent_scale: 0.8
