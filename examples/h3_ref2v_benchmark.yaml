# Reference-tag harness for MiniMax H3's ref2va path.
#
# Three references of different kinds — a person, an object, a place — carried
# into shots none of them came from. That is the actual test: not "can it copy a
# photo" but "does <Picture 1> stay the same person across three different
# framings while <Picture 2> stays the same object and <Picture 3> stays the
# same building". A recognisable face doing a fiddly physical action is a hard
# case for identity, hands and occlusion at once.
#
# Reference images are not tracked in this repo — supply your own under refs/h3/
# at the filenames below (see the reference-image section in CLAUDE.md). The
# prompts restate each reference in words as well as citing it positionally,
# because references alone drift; edit those descriptions to match whatever you
# actually supply.
#
#   scripts/h3_ref2v.py examples/h3_ref2v_benchmark.yaml
title: MiniMax H3 — reference-tag harness (person / object / place)
seconds: 5
width: 608
height: 352
seed: 7
steps: 4
ref_image_size: match

references:
  - refs/h3/person.jpg
  - refs/h3/object.jpg
  - refs/h3/place.jpg

shots:
  - label: all three
    prompt: >-
      The man from <Picture 1>, keeping his exact face, hairline and facial
      hair, stands holding the pink dragon fruit from <Picture 2> in one hand,
      in front of the domed rotunda and colonnade from <Picture 3>. Late
      afternoon sun, the lagoon behind him. He turns the fruit over, looking at
      it, then glances up toward the camera. Slow push in. Ambient park sound,
      water, distant traffic.

  - label: close-up identity
    prompt: >-
      Tight close-up on the face of the man from <Picture 1>, keeping his exact
      face, hairline and facial hair. He raises the pink dragon fruit from
      <Picture 2> into frame, turns it, and takes a bite; the white speckled
      flesh shows where it is broken. Warm late-afternoon light, shallow depth
      of field, the ochre columns of <Picture 3> soft behind him. The sound of
      the bite, faint park ambience.

  - label: tracking wide
    prompt: >-
      Wide tracking shot beside the man from <Picture 1>, keeping his exact
      face, hairline and facial hair, walking along the colonnade of
      <Picture 3> with the pink dragon fruit from <Picture 2> held at his side.
      Golden hour, long shadows between the columns, camera moving with him at
      walking pace. Footsteps on stone, birds, distant city.
