# The same ten shipped embeddings, but against a bare prompt.
#
# Companion to h3_embeddings.yaml, which layers them over a fully specified
# scene. Each embedding is ~118 pre-encoded tokens prepended to the prompt; a
# long, concrete scene description competes with them for the same conditioning,
# so a near-empty prompt is what reveals what an embedding actually encodes.
#
#   scripts/h3_batch.py examples/h3_embeddings_bare.yaml
title: MiniMax H3 — the ten effect embeddings against a bare prompt
prompt: A person standing outdoors.
seconds: 5
width: 608
height: 352
seed: 7
steps: 4

variants:
  - label: baseline (no embedding)

  - label: art_is_explosion
    prompt: embedding:minimaxh3_art_is_explosion A person standing outdoors.

  - label: blooming_flowers
    prompt: embedding:minimaxh3_blooming_flowers A person standing outdoors.

  - label: bullet_time
    prompt: embedding:minimaxh3_bullet_time A person standing outdoors.

  - label: dark_magic
    prompt: embedding:minimaxh3_dark_magic A person standing outdoors.

  - label: fire_breath
    prompt: embedding:minimaxh3_fire_breath A person standing outdoors.

  - label: four_seasons
    prompt: embedding:minimaxh3_four_seasons A person standing outdoors.

  - label: kiss_camera
    prompt: embedding:minimaxh3_kiss_camera A person standing outdoors.

  - label: spiral_ascent
    prompt: embedding:minimaxh3_spiral_ascent A person standing outdoors.

  - label: storm_magic
    prompt: embedding:minimaxh3_storm_magic A person standing outdoors.

  - label: truman_show
    prompt: embedding:minimaxh3_truman_show A person standing outdoors.
