# The ten effect embeddings shipped with the Comfy-Org MiniMax H3 repack.
# Each is a pre-encoded prompt vector dropped into the text prompt as
# `embedding:<filename stem>` — no LoRA load, no extra VRAM.
# Baseline first so every effect is judged against the same shot.
#
#   scripts/h3_batch.py examples/h3_embeddings.yaml
title: MiniMax H3 — the ten shipped effect embeddings
prompt: >-
  A lone figure in a long coat stands in an open field of tall grass at golden
  hour, wind moving through the grass, distant hills behind, camera slowly
  pushing in
seconds: 5
width: 608
height: 352
seed: 7
steps: 4

variants:
  - label: baseline (no embedding)

  - label: art_is_explosion
    prompt: >-
      embedding:minimaxh3_art_is_explosion A lone figure in a long coat stands in an
      open field of tall grass at golden hour, wind moving through the grass,
      distant hills behind, camera slowly pushing in

