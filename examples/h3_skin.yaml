      overall_soundscape: The steady low thrum of a cargo hauler under way, air
      circulating through a vent close by, the soft click of instrument switches,
      her slow breathing.

      non_diegetic_music: None.
    loras:
      - [h3_turbo_larryvrh_v4_step600_ema.safetensors, 1.0]
      - [h3_realism_people_fal.safetensors, 1.0]
      - [h3_facial_realism_closeup.safetensors, 0.8]

