      its banded cloud tops throwing pale reflected light across the left side of
      her face while the right falls into deep shadow. She blinks, glances off to a
      readout, then back toward the camera. The camera pushes in with small
      amplitude at slow speed.

      overall_soundscape: The steady low thrum of a cargo hauler under way, air
      circulating through a vent close by, the soft click of instrument switches,
      her slow breathing.

      non_diegetic_music: None.
    loras:
      - [h3_turbo_larryvrh_v4_step600_ema.safetensors, 1.0]
      - [h3_realism_people_fal.safetensors, 1.0]

  - label: prithiv Facial-Realism-CloseUp
    loras:
      - [h3_turbo_larryvrh_v4_step600_ema.safetensors, 1.0]
      - [h3_facial_realism_closeup.safetensors, 1.0]

  - label: both stacked
    prompt: |-
      integrated_multimodal_description: [Shot 1] r34l1sm, Live-action, cinematic,
